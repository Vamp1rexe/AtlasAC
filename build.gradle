plugins {
	id 'java'
}

base {
	archivesName = project.archives_base_name
}

version = project.plugin_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = 'papermc'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
	maven {
		name = 'codemc'
		url = 'https://repo.codemc.io/repository/maven-releases/'
	}
}

dependencies {
	compileOnly "io.papermc.paper:paper-api:${project.paper_version}"
	compileOnly "com.github.retrooper:packetevents-spigot:${project.packetevents_version}"
	// Wird zur Laufzeit von AtlasLoader nachgeladen (nur bei Datenbank-Speicherung)
	compileOnly "com.zaxxer:HikariCP:6.3.0"
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('paper-plugin.yml') {
		expand 'version': version
	}
}
