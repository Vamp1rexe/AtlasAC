# ─────────────────────────────────────────────────────────────
#  AtlasAC – Atlas AntiCheat
#  Alle Texte nutzen MiniMessage (https://docs.advntr.dev/minimessage/format.html)
#  Platzhalter: %player% %check% %vl% %max% %info% %ping%
# ─────────────────────────────────────────────────────────────

prefix: "<dark_gray>[<gradient:#7b5cff:#00d4ff><bold>Atlas</bold></gradient><dark_gray>] "

alerts:
  # Alerts an Spieler mit atlasac.alerts (mit /atlas alerts an-/ausschaltbar)
  format: "<click:run_command:'/tp %player%'><hover:show_text:'<gray>%info%<newline><dark_gray>Ping: %ping%ms<newline><yellow>Klicken zum Teleportieren'>%prefix%<white>%player% <gray>flagged <aqua>%check%</aqua> <dark_gray>(<red>x%vl%</red><dark_gray>/%max%)</hover></click>"
  # Mindestabstand zwischen zwei Alerts desselben Checks pro Spieler (ms)
  cooldown-ms: 300
  console: true

punishment:
  # Atlas kickt selbst mit dem Kick-Screen unten. Zusaetzliche Konsolen-Befehle (ohne fuehrenden /) optional:
  commands: []
  broadcast: "%prefix%<red>%player% <gray>wurde von Atlas wegen <aqua>%check%</aqua> gekickt."
  # Eskalation: so viele Atlas-Kicks innerhalb des Zeitfensters -> automatischer Tempban
  auto-ban:
    enabled: true
    kicks: 3
    within: 24h
    duration: 7d
    reason: "Wiederholte Cheat-Erkennung (%check%)"

# ─────────────────────────────────────────────────────────────
#  Screens (Kick / Ban) – mehrzeilig, MiniMessage
#  Platzhalter: %reason% %staff% %duration% %expires% %id%
# ─────────────────────────────────────────────────────────────
screens:
  kick: |-
    <gradient:#7b5cff:#00d4ff><bold>ATLAS ANTICHEAT</bold></gradient>
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    <red><bold>Kicked by Atlas AntiCheat</bold>

    <gray>Grund: <white>%reason%
    <gray>Fall-ID: <white>#%id%

    <dark_gray>Unfaire Vorteile werden hier nicht geduldet.
  ban: |-
    <gradient:#7b5cff:#00d4ff><bold>ATLAS ANTICHEAT</bold></gradient>
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    <dark_red><bold>Banned by Atlas AntiCheat</bold>

    <gray>Grund: <white>%reason%
    <gray>Dauer: <white>%duration%
    <gray>Endet: <white>%expires%
    <gray>Fall-ID: <white>#%id%

    <dark_gray>Fehler? Melde dich mit deiner Fall-ID beim Team.
  ipban: |-
    <gradient:#7b5cff:#00d4ff><bold>ATLAS ANTICHEAT</bold></gradient>
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    <dark_red><bold>IP-Banned by Atlas AntiCheat</bold>

    <gray>Grund: <white>%reason%
    <gray>Dauer: <white>%duration%
    <gray>Endet: <white>%expires%
    <gray>Fall-ID: <white>#%id%

    <dark_gray>Diese Verbindung ist gesperrt – auch fuer Zweit-Accounts.

# ─────────────────────────────────────────────────────────────
#  Speicher fuer Bans, Mutes, Kicks und Spieler-IPs
#  type: yaml       – lokal in plugins/AtlasAC/data.yml (Standard)
#        sqlite     – lokal in einer SQLite-Datei
#        mysql | mariadb | postgresql – externe Datenbank (mehrere Server teilen sich die Bans)
#  Treiber werden beim Start automatisch geladen. Nach einer Aenderung: Server neu starten.
#  Beim ersten Start mit Datenbank wird eine vorhandene data.yml automatisch uebernommen.
# ─────────────────────────────────────────────────────────────
storage:
  type: yaml
  sqlite-file: atlas.db
  host: localhost
  port: 3306
  database: atlasac
  username: root
  password: ""
  table-prefix: "atlas_"
  pool-size: 5
  # Bans/Mutes anderer Server so oft neu laden (nur MySQL/MariaDB/PostgreSQL)
  sync-interval-seconds: 30
  # Zusaetzliche JDBC-Optionen
  properties:
    useSSL: false
    characterEncoding: utf8

bans:
  # Broadcast an alle Spieler (leer = aus)
  broadcast: "%prefix%<red>%player% <gray>wurde von <white>%staff%</white> %action%. <dark_gray>(<gray>%reason%<dark_gray>)"
  # Team bekommt einen Alert, wenn jemand mit der IP eines gebannten Accounts joint
  alt-alerts: true

freeze:
  title: "<gradient:#7b5cff:#00d4ff><bold>EINGEFROREN</bold></gradient>"
  subtitle: "<gray>Folge den Anweisungen des Teams"
  message: "%prefix%<red>Du wurdest eingefroren. <gray>Verlasse den Server nicht – sonst wirst du automatisch gebannt."
  # Bann, wenn ein eingefrorener Spieler den Server verlaesst (duration: permanent oder z.B. 30d)
  logout-ban:
    enabled: true
    duration: 30d
    reason: "Verlassen waehrend Freeze"
  # Befehle, die eingefrorene Spieler noch nutzen duerfen – ingame: /atlas freezecmd add|remove|list
  allowed-commands: [msg, tell, w, r, reply, helpop]

staff-mode:
  # Beim Betreten von /staff automatisch unsichtbar werden
  vanish-on-enter: true

# Schnell-Strafen im Admin-GUI (/atlas gui -> Spieler -> Bestrafen)
# type: kick | mute | ban | ipban   duration: z.B. 30m, 1d, 7d, 30d, permanent
staff-gui:
  presets:
    - {name: "Kick: Cheating", type: kick, duration: "0", reason: "Cheating", icon: LEATHER_BOOTS}
    - {name: "Mute 1 Std: Spam", type: mute, duration: 1h, reason: "Spam", icon: PAPER}
    - {name: "Mute 1 Tag: Beleidigung", type: mute, duration: 1d, reason: "Beleidigung", icon: WRITABLE_BOOK}
    - {name: "Ban 3 Tage: Griefing", type: ban, duration: 3d, reason: "Griefing", icon: TNT}
    - {name: "Ban 7 Tage: Bugusing", type: ban, duration: 7d, reason: "Bugusing", icon: SPIDER_EYE}
    - {name: "Ban 30 Tage: Cheating", type: ban, duration: 30d, reason: "Cheating", icon: IRON_SWORD}
    - {name: "Ban permanent: Cheating", type: ban, duration: permanent, reason: "Cheating", icon: NETHERITE_SWORD}
    - {name: "IP-Ban permanent: Ban-Umgehung", type: ipban, duration: permanent, reason: "Ban-Umgehung", icon: BARRIER}

mute:
  message: "%prefix%<red>Du bist gemutet. <gray>Grund: <white>%reason% <dark_gray>| <gray>Endet: <white>%expires%"
  blocked-commands: [msg, tell, w, r, reply, me, say, mail]

violations:
  # Alle 60 Sekunden wird jede VL um "decay" des jeweiligen Checks reduziert
  decay-interval-seconds: 60

# ─────────────────────────────────────────────────────────────
#  Checks
#  enabled   – Check aktiv
#  max-vl    – ab dieser VL wird bestraft (nur wenn punish: true)
#  punish    – false = nur Alerts
#  buffer    – so viele "verdaechtige" Events muessen sich ansammeln, bevor geflaggt wird
#  decay     – VL-Abbau pro Intervall
#  cancel    – Treffer abbrechen bzw. Setback ausfuehren
# ─────────────────────────────────────────────────────────────
checks:
  # ── PvP ────────────────────────────────────────────────────
  reach:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 1.5
    decay: 2
    cancel: true
    # Toleranz auf die Interaction-Range des Spielers (Attribut, Standard 3.0)
    tolerance: 0.1
    # Zusaetzliche Toleranz bei Mobs (keine Lag-Compensation-Historie)
    mob-tolerance: 0.4
    # Maximal kompensierter Ping (gefakter Ping darf das Lag-Fenster nicht aufziehen)
    max-compensation-ms: 300
    # Speere (26.x) haben eigene Reichweiten -> Check ueberspringen
    ignore-spears: true
  hitbox:
    enabled: true
    max-vl: 15
    punish: true
    buffer: 3
    decay: 2
    cancel: true
    # Hitbox-Vergroesserung fuer den Blickstrahl
    expand: 0.12
  killaura-multi:
    enabled: true
    max-vl: 5
    punish: true
    buffer: 0
    decay: 1
  killaura-wall:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 2
    decay: 2
    cancel: true
  killaura-noswing:
    enabled: true
    max-vl: 8
    punish: true
    buffer: 2
    decay: 1
  aim-sensitivity:
    enabled: true
    max-vl: 40
    punish: true
    buffer: 12
    decay: 5
  aim-snap:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 0
    decay: 2
  aim-lock:
    enabled: true
    max-vl: 6
    punish: true
    buffer: 0
    decay: 2
    # Anzahl Treffer, ueber die die Zielpraezision ausgewertet wird
    samples: 20
    # Standardabweichung (Grad) des Ziel-Offsets, unter der geflaggt wird
    max-deviation: 0.35
  autoclicker-cps:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 2
    decay: 2
    max-cps: 18
  autoclicker-consistency:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 2
    decay: 2
    # Standardabweichung der Klickabstaende (ms), unter der geflaggt wird
    min-deviation-ms: 9.0
    # Ab dieser CPS wird die Konsistenz geprueft
    min-cps: 9
  velocity:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 2
    decay: 2
    # Erlaubte Abweichung (Bloecke) beim ersten Knockback-Tick – erkennt Teil-Multiplikatoren, Reversal, Strafe, Lag
    tolerance: 0.02
  criticals:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 2
    decay: 2
    cancel: true

  killaura-snap:
    enabled: true
    max-vl: 8
    punish: true
    buffer: 4
    decay: 2
    # Yaw-Sprung (Grad) im Tick vor dem Schlag aus dem Stillstand
    min-snap: 45
  place:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 2
    decay: 2
    cancel: true

  # ── Movement (Prediction) ──────────────────────────────────
  prediction-gravity:
    enabled: true
    max-vl: 20
    punish: true
    buffer: 4
    decay: 3
    cancel: true
    threshold: 0.03
  prediction-air:
    enabled: true
    max-vl: 20
    punish: true
    buffer: 4
    decay: 3
    cancel: true
    threshold: 0.006
  prediction-jump:
    enabled: true
    max-vl: 15
    punish: true
    buffer: 2
    decay: 2
    cancel: true
  groundspoof:
    enabled: true
    max-vl: 15
    punish: true
    buffer: 4
    decay: 3
    # true = Fallschaden wird trotz NoFall nachtraeglich angewendet
    cancel: true
  timer:
    enabled: true
    max-vl: 15
    punish: true
    buffer: 0
    decay: 3
    # So viele ms darf ein Client "vorauslaufen", bevor geflaggt wird
    max-balance-ms: 150
    # Maximal angespartes Lag-Guthaben (ms)
    min-balance-ms: -500

  noslow:
    enabled: true
    max-vl: 15
    punish: true
    buffer: 4
    decay: 3
    cancel: true
  phase:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 1
    decay: 2
    cancel: true
  jesus:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 0
    decay: 2
    cancel: true
  badpackets-move:
    enabled: true
    max-vl: 10
    punish: true
    buffer: 2
    decay: 3
  badpackets-break:
    enabled: true
    max-vl: 8
    punish: true
    buffer: 1
    decay: 2
  badpackets-rotate:
    enabled: true
    max-vl: 5
    punish: true
    buffer: 1
    decay: 1

# ─────────────────────────────────────────────────────────────
#  Anti-XRay (Abbau-Alerts) – auch ingame per /atlas xray (GUI) einstellbar
# ─────────────────────────────────────────────────────────────
xray:
  enabled: true
  # Von Spielern platzierte Erze nicht mitzaehlen
  ignore-placed-blocks: true
  # Mindestabstand zwischen zwei Alerts derselben Gruppe pro Spieler (Sekunden)
  alert-cooldown-seconds: 60
  # Zaehlt abgebauten Stein mit, um das Erz/Stein-Verhaeltnis im Alert anzuzeigen
  stone-blocks: [STONE, DEEPSLATE, TUFF, GRANITE, DIORITE, ANDESITE, NETHERRACK, BASALT, BLACKSTONE, CALCITE]
  format: "<click:run_command:'/tp %player%'><hover:show_text:'<gray>Stein abgebaut: <white>%stone%<newline><gray>Erze pro 100 Stein: <white>%ratio%<newline><gray>Ort: <white>%location%<newline><yellow>Klicken zum Teleportieren'>%prefix%<gold>XRay? <white>%player% <gray>hat <red>%count%x %group% <gray>in <white>%window% Min.</gray> abgebaut</hover></click>"
  groups:
    diamond:
      display: "Diamanterz"
      icon: DIAMOND_ORE
      materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
      enabled: true
      max-blocks: 12
      window-minutes: 10
    ancient-debris:
      display: "Antiker Schrott"
      icon: ANCIENT_DEBRIS
      materials: [ANCIENT_DEBRIS]
      enabled: true
      max-blocks: 8
      window-minutes: 15
    emerald:
      display: "Smaragderz"
      icon: EMERALD_ORE
      materials: [EMERALD_ORE, DEEPSLATE_EMERALD_ORE]
      enabled: true
      max-blocks: 8
      window-minutes: 10
    gold:
      display: "Golderz"
      icon: GOLD_ORE
      materials: [GOLD_ORE, DEEPSLATE_GOLD_ORE]
      enabled: false
      max-blocks: 40
      window-minutes: 10
    spawner:
      display: "Spawner"
      icon: SPAWNER
      materials: [SPAWNER]
      enabled: true
      max-blocks: 3
      window-minutes: 30

# ─────────────────────────────────────────────────────────────
#  Anti-Dupe – jedes nicht stapelbare Item bekommt eine versteckte ID
# ─────────────────────────────────────────────────────────────
anti-dupe:
  enabled: true
  # Alle X Ticks werden alle Online-Inventare, Enderkisten und offenen Container gescannt
  scan-interval-ticks: 100
  # Auf dem Boden liegende Items mit scannen
  scan-dropped-items: true
  # true = ALLE Kopien loeschen (auch das vermutliche Original), false = eine Kopie bleibt
  remove-all-copies: false
  # Stack mit Menge > 1 bei eigentlich nicht stapelbaren Items = Dupe
  flag-overstacked: true
  # Materialien, die nie getaggt werden
  ignore-materials: []
  # VL-Punkte pro erkanntem Dupe (Check "dupe")
  max-vl: 1
  punish: true
  format: "%prefix%<dark_red><bold>DUPE</bold> <white>%player% <gray>– <red>%amount%x %item% <gray>mit gleicher ID <dark_gray>(%id%)<gray> erkannt und geloescht."
